name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...
        working-directory: server
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: server
      - name: go vet
        run: go vet ./...
        working-directory: server
      - name: Summarize Go coverage
        run: go tool cover -func=coverage.out | tee coverage-summary.txt
        working-directory: server
      - name: Check Go coverage floor
        run: >-
          python3 ../scripts/check-coverage.py
          --go-profile coverage.out
          --go-floor 50.0
          --go-required-source internal/push/native.go
          --go-required-source internal/cryptoapi/cryptoapi.go
        working-directory: server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-${{ github.run_id }}
          path: |
            server/coverage.out
            server/coverage-summary.txt
          if-no-files-found: error

  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
          rustup default 1.91.0
      - run: cargo test --release --locked
        working-directory: crypto/rust
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
        working-directory: crypto/rust

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install pinned Rust Android targets
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add --toolchain 1.91.0 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Build and verify Android crypto libraries
        run: |
          sh scripts/build-mobile-crypto.sh android
          sh scripts/verify-mobile-crypto.sh android
          cargo build --manifest-path crypto/rust/Cargo.toml --locked --release
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Keep demo wiring out of the release entry point
        run: sh scripts/check-demo-boundary.sh
      - name: Verify mobile dependency policy and retractions
        run: sh scripts/check-mobile-dependencies.sh
      - name: Verify Dart dependency license files
        run: sh ../scripts/check-dart-licenses.sh
        working-directory: mobile
      - run: flutter test --coverage
        env:
          VERITRA_CRYPTO_LIBRARY: ${{ github.workspace }}/crypto/rust/target/release/libprivate_messenger_crypto.so
        working-directory: mobile
      - name: Check Flutter coverage floor
        run: >-
          python3 ../scripts/check-coverage.py
          --flutter-lcov coverage/lcov.info
          --flutter-floor 43.0
          --flutter-required-source lib/core/app_state.dart
          --flutter-required-source lib/storage/local_store.dart
          --flutter-required-source lib/push/push_service.dart
          --flutter-required-source lib/crypto/attachment_crypto.dart
          --flutter-required-source lib/calls/call_service.dart
        working-directory: mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: mobile/coverage/lcov.info
          if-no-files-found: error
      - run: flutter analyze
        working-directory: mobile
      - name: Test live Go/Dart API contracts
        run: sh scripts/test-api-contracts.sh
      - name: Test the demo message flow with real clients
        run: sh scripts/test-demo-e2e.sh
      - run: dart format --set-exit-if-changed .
        working-directory: mobile
      - name: Build Android release APK without signing
        run: flutter build apk --release
        working-directory: mobile
      - name: Verify Android ABI packaging
        run: |
          unzip -l mobile/build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/arm64-v8a/libprivate_messenger_crypto.so'
          unzip -l mobile/build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/armeabi-v7a/libprivate_messenger_crypto.so'
          unzip -l mobile/build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/x86_64/libprivate_messenger_crypto.so'
          test -s mobile/android/app/src/main/assets/veritra-crypto/cargo-metadata.json
      # An installable demo build for emulator and device testing (D10, D11).
      # Debug-signed, so it installs without a release key; never a release.
      - name: Build the Android demo APK
        run: flutter build apk --debug --target-platform android-arm64,android-x64 -t lib/main_demo.dart --dart-define=VERITRA_DEMO=true
        working-directory: mobile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veritra-demo-android-${{ github.run_id }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  mobile-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install pinned Rust iOS targets
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add --toolchain 1.91.0 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build and verify iOS crypto XCFramework
        run: |
          sh scripts/build-mobile-crypto.sh ios
          sh scripts/verify-mobile-crypto.sh ios
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build iOS app for the simulator without code signing
        run: flutter build ios --simulator --debug
        working-directory: mobile
      - name: Build the iOS demo app for the simulator
        run: flutter build ios --simulator --debug -t lib/main_demo.dart --dart-define=VERITRA_DEMO=true
        working-directory: mobile
      # Dart looks the crypto functions up in the app process, so a missing
      # force_load only fails at run time. Catch it here instead.
      - name: Verify the crypto library is linked into the demo app
        run: nm -gU mobile/build/ios/iphonesimulator/Runner.app/Runner* 2>/dev/null | grep -q '_pm_crypto_abi_version'
      - name: Package the simulator demo app
        run: ditto -c -k --keepParent mobile/build/ios/iphonesimulator/Runner.app veritra-demo-ios-simulator.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veritra-demo-ios-simulator-${{ github.run_id }}
          path: veritra-demo-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  # Unsigned demo builds for the desktop apps (Stage 3, D10). Not release
  # jobs: release/release-policy.json does not list them.
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Build the Linux crypto library
        run: sh scripts/build-desktop-crypto.sh linux
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build the Linux demo app
        run: flutter build linux --release -t lib/main_demo.dart --dart-define=VERITRA_DEMO=true
        working-directory: mobile
      - name: Verify the crypto library is bundled
        run: test -s mobile/build/linux/x64/release/bundle/lib/libprivate_messenger_crypto.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veritra-demo-linux-x64-${{ github.run_id }}
          path: mobile/build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Build the Windows crypto library
        run: ./scripts/build-desktop-crypto.ps1
        shell: pwsh
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build the Windows demo app
        run: flutter build windows --release -t lib/main_demo.dart --dart-define=VERITRA_DEMO=true
        working-directory: mobile
      - name: Verify the crypto library is bundled
        run: if (-not (Test-Path mobile/build/windows/x64/runner/Release/private_messenger_crypto.dll)) { exit 1 }
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veritra-demo-windows-x64-${{ github.run_id }}
          path: mobile/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true
      - name: Install pinned Rust macOS targets
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup target add --toolchain 1.91.0 aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the macOS crypto library
        run: sh scripts/build-desktop-crypto.sh macos
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build the macOS demo app
        run: flutter build macos --release -t lib/main_demo.dart --dart-define=VERITRA_DEMO=true
        working-directory: mobile
      - name: Verify the crypto library is linked into the app
        run: |
          binary=mobile/build/macos/Build/Products/Release/Veritra.app/Contents/MacOS/Veritra
          lipo -info "$binary"
          for arch in arm64 x86_64; do
            nm -gU -arch "$arch" "$binary" > "symbols-$arch.txt"
            grep -q ' _pm_crypto_abi_version$' "symbols-$arch.txt"
            grep -q ' _pm_crypto_device_create$' "symbols-$arch.txt"
          done
      - name: Package the unsigned app
        run: ditto -c -k --keepParent mobile/build/macos/Build/Products/Release/Veritra.app veritra-demo-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veritra-demo-macos-${{ github.run_id }}
          path: veritra-demo-macos.zip
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify Go toolchain alignment
        run: sh scripts/check-go-toolchain.sh
      - name: Build a fresh deployment image
        run: docker compose -f deploy/docker-compose.yml build --build-arg "GO_VERSION=$(tr -d '[:space:]' < .go-version)" --build-arg "COMMIT=$GITHUB_SHA"
      - name: Start a fresh-volume deployment
        env:
          PRIVATE_MESSENGER_SETUP_TOKEN: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
        run: docker compose -f deploy/docker-compose.yml up --wait --wait-timeout 120
      - name: Verify health over the published loopback port
        run: curl --fail --silent --show-error http://127.0.0.1:8080/healthz
      - name: Verify packaged container toolchain
        run: |
          image="$(docker compose -f deploy/docker-compose.yml images -q messenger)"
          test -n "$image"
          test "$(docker image inspect --format '{{index .Config.Labels "org.veritra.go-toolchain"}}' "$image")" = "$(tr -d '[:space:]' < .go-version)"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          docker run --rm --entrypoint /usr/local/bin/messenger-server "$image" version
      - name: Stop deployment
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/license-check.sh
      - name: Run release policy and evidence tests
        run: |
          python3 scripts/check-release-evidence_test.py
          python3 scripts/check-dart-retractions_test.py
          python3 scripts/check-ci-evidence_test.py
          python3 scripts/write-release-evidence_test.py
          python3 scripts/check-coverage_test.py

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum
      - name: Scan Go dependencies
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Scan Rust dependencies
        working-directory: crypto/rust
        run: sh ../../scripts/audit-rust.sh
