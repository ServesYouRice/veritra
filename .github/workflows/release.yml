name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the approvals commit must descend from this one.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: server/go.sum
      # An approval cannot be committed in the commit it names, so approvals
      # are read from the tip of the protected default branch, never from the
      # tag or a pull request ref. Resolved once, so every gate below checks
      # the same approvals commit.
      - name: Resolve the approvals commit
        id: approvals
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test -n "$DEFAULT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          echo "commit=$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Enforce production release gates
        env:
          RELEASE_APPROVALS_COMMIT: ${{ steps.approvals.outputs.commit }}
        run: sh scripts/release-readiness.sh
      - name: Require complete CI evidence for this commit
        run: |
          mkdir -p dist
          GITHUB_SHA="$GITHUB_SHA" python3 scripts/check-ci-evidence.py > dist/ci-evidence.json
      - name: Verify the release tag target
        run: test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Read canonical Go toolchain version
        id: go-toolchain
        run: echo "version=$(tr -d '[:space:]' < .go-version)" >> "$GITHUB_OUTPUT"
      - name: Build deterministic server binaries
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          LDFLAGS="-buildid= -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}"
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o ../dist/messenger-server-linux-amd64 ./cmd/messenger-server
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o ../dist/messenger-server-linux-arm64 ./cmd/messenger-server
      - name: Verify packaged binary commit
        env:
          PRIVATE_MESSENGER_DATA_DIR: ${{ runner.temp }}/veritra-release-version
        run: test "$(server=dist/messenger-server-linux-amd64; "$server" version)" = "veritra $GITHUB_REF_NAME ($GITHUB_SHA)"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/veritra.spdx.json
          upload-artifact: false
      - name: Write checksums
        working-directory: dist
        run: sha256sum messenger-server-* veritra.spdx.json > SHA256SUMS
      - name: Set container image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage provenance-attested multi-platform container image
        id: container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            GO_VERSION=${{ steps.go-toolchain.outputs.version }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:build-${{ github.sha }}
      - name: Record immutable container digest
        run: printf '%s@%s\n' '${{ steps.image.outputs.image }}:build-${{ github.sha }}' '${{ steps.container.outputs.digest }}' > dist/container-image-digest.txt
      # QA02: signed iOS and Android evidence is separate from the debug CI
      # builds (mobile-ios simulator, mobile emulator APK). The G24 signed
      # builds must stage mobile-artifacts.json, the .ipa and the .apk in this
      # directory (kept out of dist/, so nothing here is published). Nothing
      # stages them yet, so the release stays blocked until G24.
      - name: Write release evidence manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_APPROVALS_COMMIT: ${{ steps.approvals.outputs.commit }}
          CI_EVIDENCE_FILE: dist/ci-evidence.json
          MOBILE_ARTIFACTS_FILE: ${{ runner.temp }}/mobile-artifacts/mobile-artifacts.json
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}:build-${{ github.sha }}
          CONTAINER_DIGEST: ${{ steps.container.outputs.digest }}
        run: python3 scripts/write-release-evidence.py > dist/release-evidence.json
      - name: Enforce final release evidence gate
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_APPROVALS_COMMIT: ${{ steps.approvals.outputs.commit }}
          RELEASE_EVIDENCE_FILE: dist/release-evidence.json
          MOBILE_ARTIFACTS_DIR: ${{ runner.temp }}/mobile-artifacts
        run: sh scripts/release-readiness.sh
      # The offline gate checks structure and digests only. Here the signed
      # builds' GitHub attestations must prove which workflow and commit made
      # each signed .ipa and .apk. Zero signed records fails, never passes
      # vacuously.
      - name: Verify signed mobile artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_ARTIFACTS_DIR: ${{ runner.temp }}/mobile-artifacts
        run: |
          signed="$(jq -c '[.mobile_artifacts[] | select(.artifact_type == "signed-release")]' dist/release-evidence.json)"
          count="$(printf '%s' "$signed" | jq 'length')"
          test "$count" -ge 1
          for index in $(seq 0 $((count - 1))); do
            file="$(printf '%s' "$signed" | jq -r ".[$index].file")"
            workflow="$(printf '%s' "$signed" | jq -r ".[$index].provenance.workflow")"
            gh attestation verify "$MOBILE_ARTIFACTS_DIR/$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/$workflow" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Verify the tag target before promotion
        run: test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Promote verified image tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          BUILD_TAG: build-${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$IMAGE:$BUILD_TAG"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$BUILD_TAG"
          published_digest="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" | sed -n 's/^Digest: //p' | head -n 1)"
          test "$published_digest" = '${{ steps.container.outputs.digest }}'
          printf '%s@%s\n' "$IMAGE:$RELEASE_TAG" '${{ steps.container.outputs.digest }}' > dist/container-image-digest.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
