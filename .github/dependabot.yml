version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /crypto/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tls_codec must stay in lockstep with openmls. openmls 0.8.1 and its
      # whole tree (openmls_traits, the credential and provider crates) still
      # depend on tls_codec 0.4.x, so bumping it here only adds a second copy
      # of the crate: the Serialize/Deserialize traits we import stop being the
      # ones openmls types implement and crypto/rust/src/mls.rs no longer
      # compiles. See #52, which was reverted for exactly this. Lift this only
      # when openmls itself moves to tls_codec 0.5.
      - dependency-name: tls_codec
      - dependency-name: tls_codec_derive
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # flutter_secure_storage holds veritra.database_key.v1, the key to the
      # local encrypted message database. v11 removed the shims that migrate
      # data off the pre-v10 algorithms, so a major bump can leave that key
      # unrecoverable. Major upgrades here need a deliberate migration; see
      # the discussion on #40 before lifting this.
      - dependency-name: flutter_secure_storage
        update-types: ["version-update:semver-major"]
      # matcher, meta, test_api and vector_math are pinned by the Flutter SDK,
      # not by us. Dependabot resolves with its own Dart SDK, so it floats them
      # past what CI's pinned Flutter 3.44.0 ships and `flutter pub get
      # --enforce-lockfile` then rejects the lockfile. Flutter owns these; they
      # move when the pinned SDK moves.
      - dependency-name: matcher
      - dependency-name: meta
      - dependency-name: test_api
      - dependency-name: vector_math
      # build_runner >=2.16.0 needs analyzer >=13.3.0, which needs meta ^1.18.3,
      # above the SDK pin — and drift_dev 2.34.5 still wants analyzer ^13.0.0.
      # See #42, reverted for exactly this. Lift when drift_dev and the pinned
      # Flutter SDK have both caught up.
      - dependency-name: build_runner
    groups:
      dart-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns:
          - "*"
