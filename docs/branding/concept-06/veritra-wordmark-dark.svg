<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="Veritra chain link wordmark">
  <!-- K2 · Bone. Flat single ink for the mark, per docs/design.md §K: dark-ground accent and text -->
  <defs>
    <mask id="wmTuckUnderDark">
      <rect x="-512" y="-512" width="2048" height="2048" fill="#fff"/>
      <rect x="295.5" y="93" width="90" height="290" rx="45" fill="none" stroke="#000" stroke-width="54"
            transform="rotate(35 340.5 238)"/>
    </mask>
  </defs>
  <g transform="translate(-28 -21) scale(0.55)">
    <g mask="url(#wmTuckUnderDark)">
      <rect x="126.5" y="93" width="90" height="290" rx="45" fill="none" stroke="#EDE4DA" stroke-width="30"
            transform="rotate(-35 171.5 238)"/>
    </g>
    <rect x="295.5" y="93" width="90" height="290" rx="45" fill="none" stroke="#EDE4DA" stroke-width="30"
          transform="rotate(35 340.5 238)"/>
  </g>
  <!-- Wordmark (system sans; replace with brand type later). letter-spacing
       6.24 is 0.06em at this size — the value server/websetup/index.html sets
       on .wordmark, so the page and this file track identically. -->
  <text x="240" y="145" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="6.24" fill="#F3EFFA">veritra</text>
</svg>
