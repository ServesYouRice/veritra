arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# Locales: English (the template), Serbian Cyrillic (app_sr.arb) and Serbian
# Latin (app_sr_Latn.arb, generated from app_sr.arb by
# scripts/l10n-sr-latn.py; never edit it by hand). gen-l10n would fall back
# to English for a message a locale lacks; test/l10n_locales_test.dart fails
# instead, so every locale translates every message.
nullable-getter: true
