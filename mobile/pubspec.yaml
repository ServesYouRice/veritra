name: private_messenger
description: Veritra, a self-hosted, privacy-first messenger (Android, iOS and desktop).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: 2.34.4
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  path_provider: 2.1.6
  flutter_webrtc: 1.6.3
  sqlite3: 3.5.2
  file_selector: 1.1.0
  # Desktop shell (W3, W4). Newer tray_manager releases need Flutter 3.47.
  tray_manager: 0.8.0
  window_manager: 0.5.2
  local_notifier: 0.1.6
  # Composer files (W9, B4). desktop_drop 0.9 needs Flutter 3.47.
  desktop_drop: 0.8.4
  pasteboard: 0.6.0
  open_filex: 5.0.0
  # Pinned to the version flutter_localizations requires in Flutter 3.44.0;
  # the generated lib/l10n code imports it directly.
  intl: 0.20.3

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tray/
