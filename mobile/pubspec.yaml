name: private_messenger
description: Mobile-first client shell for Private Messenger.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: 2.34.3
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  path_provider: 2.1.6
  flutter_webrtc: 1.6.0
  sqlite3: 3.5.0

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.5
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
