name: private_messenger
description: Veritra, a self-hosted, privacy-first messenger (Android, iOS and desktop).
publish_to: "none"
version: 0.1.0+1

# Dependabot's pub job resolves with the newest stable Flutter that satisfies
# both constraints below (dependabot-core infer_sdk_versions.dart reads
# environment.sdk and environment.flutter, each defaulting to "any"). Without
# them it resolved with a newer Flutter whose SDK pins newer intl, matcher,
# meta, test_api and vector_math (#121). Flutter 3.44.0 ships Dart 3.12. Move
# both bounds, ci.yml's flutter-version and .github/dependabot.yml together
# when the pinned Flutter SDK moves (decision D15).
environment:
  sdk: ">=3.4.0 <3.13.0"
  flutter: 3.44.0

dependencies:
  drift: 2.34.4
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  # Sender-side link previews (B2): parses the fetched page's metadata only.
  html: 0.15.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  path_provider: 2.1.6
  flutter_webrtc: 1.6.3
  sqlite3: 3.5.2
  file_selector: 1.1.0
  # Desktop shell (W3, W4). Newer tray_manager releases need Flutter 3.47.
  tray_manager: 0.5.3
  window_manager: 0.5.2
  local_notifier: 0.1.6
  # Composer files (W9, B4). desktop_drop 0.9 needs Flutter 3.47.
  desktop_drop: 0.8.4
  pasteboard: 0.6.0
  open_filex: 5.0.0
  # Voice notes (B1): record to a file, play a decrypted copy.
  record: 7.1.2
  audioplayers: 6.8.1
  # Passkey sign-in (B7, D89/D93). Federated packages pinned exactly.
  passkeys: 2.24.1
  passkeys_platform_interface: 2.11.0
  passkeys_android: 2.15.0
  passkeys_darwin: 0.4.8
  passkeys_windows: 0.1.6
  passkeys_web: 2.11.0
  passkeys_doctor: 1.7.0
  # Pinned to the version flutter_localizations requires in Flutter 3.44.0
  # (0.20.2, decision D30); the generated lib/l10n code imports it directly.
  intl: 0.20.2

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.35.3
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tray/
