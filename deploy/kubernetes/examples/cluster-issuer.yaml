# Shared cert-manager issuer for the cluster (infra repository). The
# Cloudflare API token may edit DNS on one zone only. Store it SOPS-encrypted
# as Secret cloudflare-api-token (key api-token) in the cert-manager namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
