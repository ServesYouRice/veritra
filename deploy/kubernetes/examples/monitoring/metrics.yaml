# Headless Service for scraping only; it is not referenced by Traefik.
apiVersion: v1
kind: Service
metadata:
  name: veritra-metrics
  namespace: veritra
  labels:
    app.kubernetes.io/name: veritra
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: veritra
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: veritra
    app.kubernetes.io/component: server
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
# Only the collector in the `observability` namespace may scrape (the owner's
# infra runs its OpenTelemetry Collector there). Change the namespace label if
# your Prometheus or Grafana Alloy runs elsewhere, for example `monitoring`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-metrics-from-observability
  namespace: veritra
  labels:
    app.kubernetes.io/name: veritra
    app.kubernetes.io/part-of: veritra
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: veritra
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090
