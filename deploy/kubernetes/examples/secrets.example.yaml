# Example shapes only. Never commit real values unencrypted: in the infra
# repository, encrypt these with SOPS (age) and let Flux decrypt them.
#
# veritra-secrets is mounted as files at /run/secrets/veritra and read through
# the PRIVATE_MESSENGER_*_FILE variables set in the overlay. Include only the
# keys you use; remove setup-token (and its _FILE variable) after owner setup.
apiVersion: v1
kind: Secret
metadata:
  name: veritra-secrets
  namespace: veritra
type: Opaque
stringData:
  setup-token: REPLACE-WITH-messenger-server-generate-setup-token-OUTPUT
  # vapid-private-key: ...
  # fcm-private-key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  # apns-private-key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  # turn-shared-secret: ...
---
# Read only by the rclone containers of the backup and restore-drill jobs.
# Use an R2 API token scoped to this one bucket with object read and write
# only. "offsite" is the remote the jobs use; it points into the bucket.
apiVersion: v1
kind: Secret
metadata:
  name: veritra-r2
  namespace: veritra
type: Opaque
stringData:
  rclone.conf: |
    [r2]
    type = s3
    provider = Cloudflare
    access_key_id = REPLACE-ME
    secret_access_key = REPLACE-ME
    endpoint = https://REPLACE-ACCOUNT-ID.r2.cloudflarestorage.com
    region = auto
    no_check_bucket = true

    [offsite]
    type = alias
    remote = r2:REPLACE-BUCKET/veritra
