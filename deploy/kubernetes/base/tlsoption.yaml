# TLS settings for the Veritra route (ingressroute.yaml names it in
# tls.options). It offers the post-quantum hybrid X25519MLKEM768 first, so a
# recorded session cannot be decrypted later with a quantum computer
# ("harvest now, decrypt later"), and keeps classical groups for clients
# without it: X25519, then P-256, as Caddy's default list does. TLS 1.2
# clients cannot use the hybrid and get X25519.
#
# - Needs Traefik v3.5 or later (k3s v1.34.12 bundles v3.7.13). An older
#   Traefik does not know the X25519MLKEM768 name, and then refuses every
#   TLS connection to this host rather than falling back. Check Traefik's
#   log and a handshake after applying it (docs/operations.md, Post-quantum
#   TLS).
# - Unset fields keep Traefik's defaults (ALPN h2, http/1.1). minVersion is
#   set because a TLSOption without it would not inherit Traefik's TLS 1.2
#   floor.
# - Not named "default": that would apply to every route on the cluster,
#   which is the infra repository's choice. This option replaces "default"
#   for the Veritra host, so hardening that infra adds to "default" (TLS 1.3
#   only, cipher suites, sniStrict) must be copied here too.
# - server/cmd/messenger-server/edge_tls_test.go checks the names against Traefik's
#   table and the negotiated groups.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: veritra
spec:
  minVersion: VersionTLS12
  curvePreferences:
    - X25519MLKEM768
    - X25519
    - CurveP256
